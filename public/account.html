<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#101b32"><title>Account | ORIKAEZE HUB Marketplace Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#17243a;font:15px/1.6 system-ui,Arial}.top{background:#101b32;color:white;padding:18px 5%;display:flex;justify-content:space-between}.top a{color:#c7f27a;text-decoration:none}.wrap{max-width:480px;margin:45px auto;padding:0 16px}.card{background:white;border:1px solid #e3eaf0;border-radius:18px;padding:24px;box-shadow:0 16px 45px #10213b0d}h1{margin:0 0 6px;font-size:27px}.muted{color:#718096;font-size:13px}label{display:block;font-size:12px;font-weight:800;margin:14px 0 5px}input{width:100%;padding:12px;border:1px solid #dce5ed;border-radius:9px;font:inherit}.btn{border:0;background:#0b9b70;color:white;border-radius:9px;padding:13px 16px;font-weight:900;width:100%;margin-top:18px}.switch{border:0;background:none;color:#087b59;font-weight:800;padding:12px 0;cursor:pointer}.msg{font-size:13px;color:#087b59}.err{color:#b42318}.hide{display:none!important}
</style></head><body><header class="top"><b>ORIKAEZE HUB · STAGING</b><a href="/marketplace.html">Marketplace</a></header><main class="wrap"><section class="card"><h1 id="heading">Welcome back</h1><p class="muted" id="intro">Sign in to your staging account to request marketplace orders or manage your seller application.</p><form id="form"><div id="nameWrap" class="hide"><label>Full name</label><input id="name" maxlength="80" autocomplete="name"></div><label>Email address</label><input id="email" type="email" required autocomplete="email"><div id="phoneWrap" class="hide"><label>Phone number</label><input id="phone" required inputmode="tel" autocomplete="tel"></div><label>Password</label><input id="password" type="password" required minlength="10" maxlength="128" autocomplete="current-password"><button class="btn" id="submit">Sign in</button></form><button class="switch" id="toggle">Create a staging account</button><p class="msg" id="message"></p><p class="muted">This is an isolated test account. It is separate from your live ORIKAEZE HUB customer account and cannot buy live data or airtime.</p></section></main>
<script>
const API="", $=id=>document.getElementById(id);let mode="login";
function render(){const reg=mode==="register";$("heading").textContent=reg?"Create a staging account":"Welcome back";$("intro").textContent=reg?"Register a separate test account for marketplace checks.":"Sign in to your staging account to request marketplace orders or manage your seller application.";$("nameWrap").classList.toggle("hide",!reg);$("phoneWrap").classList.toggle("hide",!reg);$("name").required=reg;$("phone").required=reg;$("submit").textContent=reg?"Create account":"Sign in";$("toggle").textContent=reg?"I already have an account":"Create a staging account";$("message").textContent=""}
$("toggle").onclick=()=>{mode=mode==="login"?"register":"login";render()};
$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("message").className="msg";$("message").textContent="Please wait…";try{const body={email:$("email").value.trim(),password:$("password").value};if(mode==="register")Object.assign(body,{fullName:$("name").value.trim(),phone:$("phone").value.trim()});const r=await fetch(API+(mode==="login"?"/api/auth/login":"/api/auth/register"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||"Account request failed");localStorage.setItem("odh_token",d.token);const next=new URLSearchParams(location.search).get("next");location.href=next==="seller.html"?"/seller.html":"/marketplace.html"}catch(err){$("message").className="msg err";$("message").textContent=err.message}finally{$("submit").disabled=false}};
(async()=>{const t=localStorage.getItem("odh_token");if(t){try{const r=await fetch(API+"/api/auth/me",{headers:{Authorization:"Bearer "+t}});if(r.ok){const n=new URLSearchParams(location.search).get("next");location.href=n==="seller.html"?"/seller.html":"/marketplace.html"}}catch{}}})();
render();
</script></body></html>
