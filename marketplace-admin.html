<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><meta name="robots" content="noindex,nofollow"><title>Marketplace Control | ORIKAEZE HUB</title><style>
:root{--n:#101b32;--g:#0b9b70;--p:#f4f7fa;--line:#e5ebf1;--m:#718096}*{box-sizing:border-box}body{margin:0;background:var(--p);color:#17243a;font:14px/1.55 Inter,system-ui,Arial}.top{background:var(--n);color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.top small{display:block;color:#aebbd0;font-size:10px}.wrap{max-width:1200px;margin:26px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 9px 28px #152b4308}.login{max-width:430px;margin:65px auto}h1{font-size:27px;margin:4px 0 8px}h2{font-size:17px;margin:0 0 12px}p,.muted{font-size:12px;color:var(--m)}label{display:block;font-size:12px;font-weight:800;margin:13px 0 5px}input,select,textarea{width:100%;border:1px solid #dce5ed;border-radius:8px;padding:11px;font:inherit}.btn{border:0;border-radius:8px;background:var(--g);color:white;padding:10px 13px;font-weight:900;font-size:11px;cursor:pointer}.btn.alt{background:#e8f6ef;color:#087b59}.btn.red{background:#fff0ee;color:#b42318}.btn:disabled{opacity:.5}.hidden{display:none!important}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tabs button{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;font-weight:800;font-size:11px}.tabs button.active{background:var(--n);color:white}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f6f9fb;border:1px solid var(--line);border-radius:10px;padding:13px}.stat small{display:block;color:var(--m);font-size:10px}.stat b{font-size:21px;color:#087b59}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:11px;padding:13px}.item h3{margin:0;font-size:14px}.item p{margin:4px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.message{font-size:12px;color:var(--g)}.error{color:#b42318}.money{font-weight:900;color:#087b59}.fieldrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{margin:17px auto}.card{padding:15px}}
</style></head><body><header class="top"><div><b>ORIKAEZE HUB</b><small>MARKETPLACE OWNER CONTROL</small></div><a href="marketplace.html">Main admin ↗</a></header><main class="wrap">
<section id="login" class="card login"><h1>Owner access</h1><p>Only the platform owner can approve sellers, products, orders and payouts.</p><form id="loginForm"><label>Administrator email</label><input id="email" type="email" required><label>Administrator password</label><input id="password" type="password" required><button class="btn" style="width:100%;margin-top:15px">Secure login</button></form><p id="loginMsg" class="error"></p></section>
<section id="app" class="hidden"><div class="card"><div class="row"><div><h1>Marketplace overview</h1><p class="muted">Owner-controlled seller approvals, listings, order review, commission and seller payouts.</p></div><button class="btn alt" id="logout">Log out</button></div><div id="stats" class="stats"></div></div>
<div class="card"><div class="tabs"><button class="active" data-tab="sellers">Sellers</button><button data-tab="products">Products</button><button data-tab="orders">Orders</button><button data-tab="payouts">Payouts</button><button data-tab="settings">Commission</button></div><div id="panel">Loading…</div></div></section></main>
<script>
const API="https://orikaeze-data-hub.eruakennethnnabuike.workers.dev",$=id=>document.getElementById(id);let token=sessionStorage.getItem("odh_admin_token")||"";
const money=k=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN"}).format((Number(k)||0)/100);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function call(path,body){const r=await fetch(API+path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||"Request failed");return d}
async function start(){try{await call("/api/admin/me");$("login").classList.add("hidden");$("app").classList.remove("hidden");const d=await call("/api/admin/marketplace/overview"),s=d.stats;$("stats").innerHTML=[["Sellers",s.sellers],["Products",s.products],["Orders",s.orders],["Payouts awaiting review",s.pending_payouts],["Commission",s.commission_percent+"%"]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join("");loadTab("sellers")}catch(e){$("login").classList.remove("hidden");$("loginMsg").textContent=e.message}}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.message||"Login failed");token=d.token;sessionStorage.setItem("odh_admin_token",token);$("password").value="";start()}catch(x){$("loginMsg").textContent=x.message}};
$("logout").onclick=()=>{sessionStorage.removeItem("odh_admin_token");token="";$("app").classList.add("hidden");$("login").classList.remove("hidden")};
async function post(path,body){const d=await call(path,body);alert(d.message||"Updated");loadTab(document.querySelector("[data-tab].active")?.dataset.tab||"sellers");startStats()}
async function startStats(){try{const d=await call("/api/admin/marketplace/overview"),s=d.stats;$("stats").innerHTML=[["Sellers",s.sellers],["Products",s.products],["Orders",s.orders],["Payouts awaiting review",s.pending_payouts],["Commission",s.commission_percent+"%"]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join("")}catch{}}
async function loadTab(tab){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));const p=$("panel");p.innerHTML="Loading…";try{
if(tab==="sellers"){const d=await call("/api/admin/marketplace/sellers");p.innerHTML=(d.sellers||[]).length?'<div class="list">'+d.sellers.map(x=>'<article class="item"><div class="row"><h3>'+esc(x.store_name)+'</h3><span class="status">'+esc(x.status)+'</span></div><p>Owner: '+esc(x.full_name)+' · '+esc(x.email)+' · '+esc(x.phone)+'</p><p>Settlement: '+esc(x.bank_name)+' · '+esc(x.account_name)+' · '+esc(x.account_number)+'</p><p>'+esc(x.description)+'</p><div class="actions">'+(x.status!=="approved"?'<button class="btn" data-seller="'+esc(x.id)+'" data-status="approved">Approve seller</button>':"")+'<button class="btn red" data-seller="'+esc(x.id)+'" data-status="suspended">Suspend</button><button class="btn alt" data-seller="'+esc(x.id)+'" data-status="rejected">Reject</button></div></article>').join(""):'<p>No seller applications yet.</p>';p.querySelectorAll("[data-seller]").forEach(b=>b.onclick=()=>post("/api/admin/marketplace/seller-review",{sellerId:b.dataset.seller,status:b.dataset.status}))}
if(tab==="products"){const d=await call("/api/admin/marketplace/products");p.innerHTML=(d.products||[]).length?'<div class="list">'+d.products.map(x=>'<article class="item"><div class="row"><h3>'+esc(x.title)+'</h3><span>'+esc(x.status)+'</span></div><p>'+esc(x.store_name)+' · '+esc(x.category)+' · '+money(x.price_kobo)+' · Stock '+x.stock_quantity+'</p><div class="actions">'+(x.status!=="approved"?'<button class="btn" data-product="'+esc(x.id)+'" data-status="approved">Approve</button>':"")+'<button class="btn red" data-product="'+esc(x.id)+'" data-status="rejected">Reject</button><button class="btn alt" data-product="'+esc(x.id)+'" data-status="archived">Archive</button></div></article>').join(""):'<p>No submitted products yet.</p>';p.querySelectorAll("[data-product]").forEach(b=>b.onclick=()=>post("/api/admin/marketplace/product-review",{productId:b.dataset.product,status:b.dataset.status}))}
if(tab==="orders"){const d=await call("/api/admin/marketplace/orders");p.innerHTML=(d.orders||[]).length?'<div class="list">'+d.orders.map(x=>'<article class="item"><h3>'+esc(x.title)+' · '+esc(x.reference)+'</h3><p>Buyer: '+esc(x.full_name)+' · '+esc(x.email)+' · '+esc(x.phone)+'</p><p>Seller: '+esc(x.store_name)+' · Qty '+x.quantity+' · Total <b>'+money(x.total_kobo)+'</b></p><p>Payment: '+esc(x.payment_status)+' · Order: '+esc(x.status)+' · Platform commission: '+money(x.commission_kobo)+' · Seller earning: '+money(x.seller_earning_kobo)+'</p><p>Delivery: '+esc(x.delivery_details)+'</p><div class="actions"><button class="btn" data-order="'+esc(x.reference)+'" data-pay="paid" data-status="accepted">Confirm paid & accept</button><button class="btn alt" data-order="'+esc(x.reference)+'" data-pay="'+esc(x.payment_status)+'" data-status="processing">Processing</button><button class="btn" data-order="'+esc(x.reference)+'" data-pay="'+esc(x.payment_status)+'" data-status="fulfilled">Mark fulfilled</button><button class="btn red" data-order="'+esc(x.reference)+'" data-pay="'+(x.payment_status==="paid"?"refunded":esc(x.payment_status))+'" data-status="cancelled">Cancel</button></div></article>').join(""):'<p>No marketplace orders yet.</p>';p.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{if(b.dataset.status==="accepted"&&b.dataset.pay==="paid"&&!confirm("Only continue after checking your platform bank account and confirming the full payment and order reference. Have you verified the transfer?"))return;if(b.dataset.status==="cancelled"&&b.dataset.pay==="refunded"&&!confirm("Before continuing, confirm that you have already refunded the customer's payment outside this marketplace. This action records the refund and cancels the order. Continue?"))return;post("/api/admin/marketplace/order-review",{reference:b.dataset.order,paymentStatus:b.dataset.pay,status:b.dataset.status,adminNote:""})})}
if(tab==="payouts"){const d=await call("/api/admin/marketplace/payouts");p.innerHTML=(d.payouts||[]).length?'<div class="list">'+d.payouts.map(x=>'<article class="item"><h3>'+money(x.amount_kobo)+' · '+esc(x.status)+'</h3><p>'+esc(x.store_name)+' · '+esc(x.full_name)+' · '+esc(x.email)+'</p><p>Bank: '+esc(x.bank_name)+' · Account: '+esc(x.account_name)+' · '+esc(x.account_number)+'</p><div class="actions"><button class="btn alt" data-payout="'+esc(x.id)+'" data-status="approved">Approve</button><button class="btn" data-payout="'+esc(x.id)+'" data-status="paid">Mark paid</button><button class="btn red" data-payout="'+esc(x.id)+'" data-status="rejected">Reject</button></div></article>').join(""):'<p>No payout requests yet.</p>';p.querySelectorAll("[data-payout]").forEach(b=>b.onclick=()=>{let ref="";if(b.dataset.status==="paid"){ref=prompt("Enter transfer reference to record this payout:")||"";if(!ref)return}post("/api/admin/marketplace/payout-review",{payoutId:b.dataset.payout,status:b.dataset.status,payoutReference:ref,adminNote:""})})}
if(tab==="settings"){const d=await call("/api/admin/marketplace/overview"),pay=d.payment_details||{};p.innerHTML='<h2>Platform commission</h2><p>Set the commission applied to new marketplace orders.</p><form id="commissionForm" class="fieldrow"><div><label>Commission percentage (0–30%)</label><input id="rate" type="number" min="0" max="30" step=".5" value="'+d.stats.commission_percent+'" required></div><button class="btn">Save commission</button></form><p id="settingMsg" class="message"></p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>Customer payment account</h2><p>These are the platform account details customers will see after placing an order. Use an account controlled by you or your business. Do not use a seller’s bank account here.</p><div id="paymentSaved" class="item"></div><button type="button" class="btn alt" id="editPayment" style="margin:10px 0">Edit payment details</button><form id="paymentForm" class="hidden"><label>Bank / financial institution</label><select id="payBank" required><option value="">Select your bank</option></select><label>Account name</label><input id="payName" maxlength="100" value="'+esc(pay.account_name)+'" required><label>10-digit account number</label><input id="payNumber" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" value="'+esc(pay.account_number)+'" required><label>Additional payment instructions (optional)</label><textarea id="payInstructions" rows="3" maxlength="500">'+esc(pay.instructions)+'</textarea><button class="btn" style="margin-top:12px">Save payment details</button><button type="button" class="btn alt" id="cancelPayment" style="margin:12px 0 0 8px">Cancel</button></form><p id="paymentMsg" class="message"></p>'; const bankOptions=["Access Bank","Citibank Nigeria","Ecobank Nigeria","Fidelity Bank","First Bank of Nigeria","First City Monument Bank (FCMB)","Globus Bank","Guaranty Trust Bank (GTBank)","Jaiz Bank","Keystone Bank","Lotus Bank","Moniepoint MFB","Optimus Bank","OPay","Parallex Bank","PalmPay","Polaris Bank","PremiumTrust Bank","Providus Bank","Standard Chartered Bank","Stanbic IBTC Bank","Sterling Bank","SunTrust Bank","TAJBank","Union Bank of Nigeria","United Bank for Africa (UBA)","Unity Bank","Wema Bank","Zenith Bank","Other bank / financial institution"]; bankOptions.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;$("payBank").appendChild(o)}); if(pay.bank_name&&!bankOptions.includes(pay.bank_name)){const o=document.createElement("option");o.value=pay.bank_name;o.textContent=pay.bank_name;$("payBank").appendChild(o)} $("payBank").value=pay.bank_name||""; const paymentForm=$("paymentForm"),paymentSaved=$("paymentSaved"),editPayment=$("editPayment"); const showSavedPayment=()=>{paymentSaved.innerHTML=pay.bank_name&&pay.account_name&&pay.account_number?'<h3>Saved payment account</h3><p><b>Bank:</b> '+esc(pay.bank_name)+'</p><p><b>Account name:</b> '+esc(pay.account_name)+'</p><p><b>Account number:</b> '+esc(pay.account_number)+'</p><p><b>Instructions:</b> '+esc(pay.instructions||"None added")+"</p>":'<p>No payment account saved yet.</p>';paymentForm.classList.toggle("hidden",!!(pay.bank_name&&pay.account_name&&pay.account_number));editPayment.classList.toggle("hidden",!(pay.bank_name&&pay.account_name&&pay.account_number))}; showSavedPayment(); editPayment.onclick=()=>{paymentForm.classList.remove("hidden");editPayment.classList.add("hidden")}; $("cancelPayment").onclick=()=>{paymentForm.classList.add("hidden");editPayment.classList.remove("hidden")}; $("commissionForm").onsubmit=async e=>{e.preventDefault();try{const r=await call("/api/admin/marketplace/commission",{percent:Number($("rate").value)});$("settingMsg").textContent=r.message;startStats()}catch(x){$("settingMsg").textContent=x.message}}; $("paymentForm").onsubmit=async e=>{e.preventDefault();try{const r=await call("/api/admin/marketplace/payment-details",{bankName:$("payBank").value,accountName:$("payName").value,accountNumber:$("payNumber").value,instructions:$("payInstructions").value});$("paymentMsg").textContent=r.message;pay.bank_name=$("payBank").value;pay.account_name=$("payName").value;pay.account_number=$("payNumber").value;pay.instructions=$("payInstructions").value;showSavedPayment()}catch(x){$("paymentMsg").textContent=x.message;$("paymentMsg").classList.add("error")}}}
}catch(e){p.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>loadTab(b.dataset.tab));if(token)start();
</script></body></html>
