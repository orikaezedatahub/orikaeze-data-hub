<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#101b32"><title>My Account | ORIKAEZE HUB</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#17243a;font:15px/1.6 system-ui,Arial}.top{background:#101b32;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a{color:#c7f27a;text-decoration:none;font-weight:800}.wrap{max-width:900px;margin:32px auto;padding:0 16px 55px}.card{background:white;border:1px solid #e3eaf0;border-radius:18px;padding:22px;box-shadow:0 16px 45px #10213b0d}h1{margin:0 0 6px;font-size:27px}.muted{color:#718096;font-size:13px}.auth{max-width:480px;margin:45px auto}.auth h1{font-size:27px}label{display:block;font-size:12px;font-weight:800;margin:14px 0 5px}input{width:100%;padding:12px;border:1px solid #dce5ed;border-radius:9px;font:inherit}.btn{border:0;background:#0b9b70;color:white;border-radius:9px;padding:12px 16px;font-weight:900;margin-top:15px;cursor:pointer}.btn.block{width:100%}.switch{border:0;background:none;color:#087b59;font-weight:800;padding:12px 0;cursor:pointer}.msg{font-size:13px;color:#087b59}.err{color:#b42318}.hide{display:none!important}.orders-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:25px 0 14px}.orders{display:grid;gap:13px}.order{background:#fff;border:1px solid #e3eaf0;border-radius:15px;padding:15px;display:grid;grid-template-columns:90px 1fr;gap:15px}.photo{width:90px;height:100px;border-radius:11px;object-fit:cover;background:#edf2f7}.order h3{margin:0 0 3px;font-size:16px}.order p{margin:3px 0;color:#64748b;font-size:13px;overflow-wrap:anywhere}.ref{font-size:11px;color:#718096}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{background:#eef8f3;color:#087b59;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:800}.tag.gray{background:#eef2f6;color:#536176}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:15px;text-align:center;padding:32px 18px}.empty b{font-size:17px}.empty p{font-size:13px;color:#718096}.details{margin-top:10px;padding-top:9px;border-top:1px solid #edf0f4;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#526176}.actions{display:flex;gap:8px;align-items:center}.actions button{margin:0}@media(max-width:520px){.order{grid-template-columns:72px 1fr;padding:12px;gap:11px}.photo{width:72px;height:82px}.wrap{margin:22px auto}}
</style></head><body><header class="top"><b>ORIKAEZE HUB · MY ACCOUNT</b><nav><a href="https://orikaezedatahub.github.io/orikaeze-data-hub/marketplace.html">Marketplace</a> &nbsp; <a href="https://orikaezedatahub.github.io/orikaeze-data-hub/seller.html">Seller Studio</a></nav></header>
<main class="wrap"><section class="card auth" id="authPanel"><h1 id="heading">Welcome back</h1><p class="muted" id="intro">Sign in to view your marketplace orders or request new products.</p><form id="form"><div id="nameWrap" class="hide"><label>Full name</label><input id="name" maxlength="80" autocomplete="name"></div><label>Email address</label><input id="email" type="email" required autocomplete="email"><div id="phoneWrap" class="hide"><label>Phone number</label><input id="phone" inputmode="tel" autocomplete="tel"></div><label>Password</label><input id="password" type="password" required minlength="10" maxlength="128" autocomplete="current-password"><button class="btn block" id="submit">Sign in</button></form><button class="switch" id="toggle">Create an account</button><p class="msg" id="message"></p></section>
<section id="accountPanel" class="hide"><div class="card"><div class="actions" style="justify-content:space-between"><div><h1>My Account</h1><p class="muted" id="welcome">Your marketplace activity</p></div><button class="btn" id="logout">Sign out</button></div><div class="orders-head"><div><h2 style="margin:0;font-size:21px">My Orders</h2><p class="muted" style="margin:2px 0">Products you have requested from ORIKAEZE HUB.</p></div><button class="btn" id="refresh">Refresh orders</button></div><div id="orders" class="orders"><div class="empty"><b>Loading your orders…</b></div></div></div></section></main>
<script>
const API="https://orikaeze-data-hub.eruakennethnnabuike.workers.dev", $=id=>document.getElementById(id);let mode="login";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(k){return new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN"}).format((Number(k)||0)/100)}
function renderAuth(){const reg=mode==="register";$("heading").textContent=reg?"Create your account":"Welcome back";$("intro").textContent=reg?"Create an account to request products and track your orders.":"Sign in to view your marketplace orders or request new products.";$("nameWrap").classList.toggle("hide",!reg);$("phoneWrap").classList.toggle("hide",!reg);$("name").required=reg;$("phone").required=false;$("submit").textContent=reg?"Create account":"Sign in";$("toggle").textContent=reg?"I already have an account":"Create an account";$("message").textContent=""}
$("toggle").onclick=()=>{mode=mode==="login"?"register":"login";renderAuth()};
function savedAuthToken(){try{const t=localStorage.getItem("odh_token");if(t)return t}catch(e){}try{return sessionStorage.getItem("odh_token")||""}catch(e){return ""}}function saveAuthToken(value){try{localStorage.setItem("odh_token",value)}catch(e){}try{sessionStorage.setItem("odh_token",value)}catch(e){}}function clearAuthToken(){try{localStorage.removeItem("odh_token")}catch(e){}try{sessionStorage.removeItem("odh_token")}catch(e){}}async function request(path,options={}){const token=savedAuthToken();const r=await fetch(API+path,{...options,headers:{...(options.headers||{}),...(token?{Authorization:"Bearer "+token}:{})}});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||"Request failed");return d}
async function loadOrders(){const box=$("orders");box.innerHTML='<div class="empty"><b>Loading your orders…</b></div>';try{const d=await request("/api/marketplace/orders");const orders=d.orders||[];if(!orders.length){box.innerHTML='<div class="empty"><b>You have no orders yet</b><p>When you request a product from the marketplace, it will appear here with its picture and order details.</p><a class="btn" href="https://orikaezedatahub.github.io/orikaeze-data-hub/marketplace.html" style="display:inline-block;text-decoration:none">Browse marketplace</a></div>';return}box.innerHTML=orders.map(o=>{const status=String(o.status||"requested").replace(/_/g," "),pay=String(o.payment_status||"unpaid").replace(/_/g," ");return '<article class="order"><img class="photo" src="'+(o.image_url?esc(o.image_url):'')+'" alt="'+esc(o.title)+'" onerror="this.style.visibility=\'hidden\'"><div><h3>'+esc(o.title)+'</h3><p>Seller: '+esc(o.store_name)+'</p><p>Quantity: <b>'+Number(o.quantity)+'</b> · Price each: '+money(o.unit_price_kobo)+'</p><p>Total: <b>'+money(o.total_kobo)+'</b></p><div class="ref">Order reference: '+esc(o.reference)+'</div><div class="tags"><span class="tag">'+esc(status)+'</span><span class="tag gray">Payment: '+esc(pay)+'</span></div><p class="ref">Ordered: '+esc(o.created_at||"")+'</p><details class="details"><summary>Delivery details</summary>'+esc(o.delivery_details||"No delivery details recorded.")+'</details></div></article>'}).join("")}catch(e){box.innerHTML='<div class="empty"><b>Could not load your orders</b><p>'+esc(e.message)+'</p><button class="btn" id="retry">Try again</button></div>';$("retry").onclick=loadOrders}}
async function showAccount(){ $("authPanel").classList.add("hide");$("accountPanel").classList.remove("hide");try{const me=await request("/api/auth/me");$("welcome").textContent="Hello, "+(me.user?.full_name||me.user?.email||"customer")+". Here are your marketplace orders.";await loadOrders()}catch(e){clearAuthToken();$("accountPanel").classList.add("hide");$("authPanel").classList.remove("hide");$("message").textContent="Please sign in to view your orders."}}
$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("message").className="msg";$("message").textContent="Please wait…";try{const body={email:$("email").value.trim(),password:$("password").value};if(mode==="register")Object.assign(body,{fullName:$("name").value.trim(),phone:$("phone").value.trim()});const d=await fetch(API+(mode==="login"?"/api/auth/login":"/api/auth/register"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(async r=>{const x=await r.json();if(!r.ok||!x.success)throw Error(x.message||"Account request failed");return x});saveAuthToken(d.token);const next=new URLSearchParams(location.search).get("next");if(next==="seller.html")location.href="https://orikaezedatahub.github.io/orikaeze-data-hub/seller.html";else await showAccount()}catch(err){$("message").className="msg err";$("message").textContent=err.message}finally{$("submit").disabled=false}};
$("refresh").onclick=loadOrders;$("logout").onclick=async()=>{try{await request("/api/auth/logout",{method:"POST"})}catch{}localStorage.removeItem("odh_token");$("accountPanel").classList.add("hide");$("authPanel").classList.remove("hide");mode="login";renderAuth()};
(async()=>{const next=new URLSearchParams(location.search).get("next");const savedToken=savedAuthToken();if(savedToken&&next!=="seller.html"){try{await request("/api/auth/me");await showAccount();return}catch(e){clearAuthToken()}}renderAuth()})();
</script></body></html>
